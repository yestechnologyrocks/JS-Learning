      :root {

      body {

        margin: 22px 0 12px;
      }
      input,

        font: inherit;
        padding: 9px 10px;
        border-radius: 5px;
      }
      input {
        flex: 1;
        border: 1px solid #aeb7c2;
      }
      button {
        background: #1769aa;
        border: 1px solid #1769aa;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #125687;
      }
      li {
        margin: 8px 0;
        padding: 10px;
        border: 1px solid #e1e5e9;
        border-radius: 5px;
      }
      .code {
        margin-top: 28px;
        padding: 16px;
        background: #f3f5f7;
        border-left: 4px solid #1769aa;
        font-family: monospace;
        white-space: pre-wrap;
        line-height: 1.6;
      }
      .tip {
        font-size: 14px;
        color: #4b5563;
      }
    </style>
